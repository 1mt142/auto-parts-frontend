version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auto_parts_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api # change if backend is somewhere else
    ports:
      - "3000:3000"
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  frontend-network:
    driver: bridge
